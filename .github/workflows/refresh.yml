name: refresh
on:
  schedule:
    - cron: "30 22 * * *"   # after the US close, 22:30 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: cache/prices.duckdb
          key: duckdb-${{ github.run_id }}
          restore-keys: duckdb-
      - name: Fetch prices
        run: python scripts/fetch.py --db cache/prices.duckdb
      - name: Run models
        run: python scripts/run_all.py --db cache/prices.duckdb --out web/public/data --fundamentals
      - name: Commit changed data
        run: |
          git config user.name "ledger-bot"
          git config user.email "ledger-bot@users.noreply.github.com"
          git add web/public/data
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "data: refresh $(date -u +%F)"
          git push
